      to { opacity: 1; transform: translateY(0); }
    }

    .inspector-header {
      display: flex;

    }

      padding: 0.6rem;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
    }

  <script>
    let scale = 1;
    let pointX = 0, pointY = 0;
    let startX = 0, startY = 0;
    let isPanning = false;

    const container = document.getElementById('container');
    const svg = document.getElementById('svg-canvas');

    function setTransform() {
      svg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    container.onmousedown = function (e) {
      if (e.target.closest('.arch-node')) return;
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    };

    window.onmousemove = function (e) {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      setTransform();
    };

    window.onmouseup = function () { isPanning = false; };

    container.onwheel = function (e) {
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = -e.deltaY;
      (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      setTransform();
    };

    function zoomIn() { scale *= 1.2; setTransform(); }
    function zoomOut() { scale /= 1.2; setTransform(); }
    function resetView() { scale = 1; pointX = 0; pointY = 0; setTransform(); }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function inspectNode(title, desc, file, line) {
      document.getElementById('ins-title').innerText = title;
      document.getElementById('ins-desc').innerText = desc;
      document.getElementById('ins-source').innerText = `Ubicación: ${file}:${line}`;
      document.getElementById('inspector').style.display = 'block';
    }

    function closeInspector() {
      document.getElementById('inspector').style.display = 'none';
    }
  </script>
